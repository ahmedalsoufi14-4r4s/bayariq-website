<!doctype html>
<html lang="ar" dir="rtl" class="scroll-pt-28 md:scroll-pt-20">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Same title as "meta" in src/i18n/ar.json. LanguageProvider.jsx switches it to English. -->
    <title>أسواق بيارق الخير الاقتصادية | فروعنا في جدة</title>
    <meta
      name="description"
      content="أسواق بيارق الخير الاقتصادية: أربعة فروع في جدة، في الحمدانية وكيلو 14 والمحاميد، وبيارق التوفيق في الحرازات. تصفّح منتجاتنا وعروضنا، وأرسل طلبك عبر واتساب."
    />
    <!-- The site's address, same as "website" in src/data/store.json. -->
    <link
      rel="canonical"
      href="https://ahmedalsoufi14-4r4s.github.io/bayariq-website/"
    />
    <!-- Colors the browser bar on phones: the navy of the header (--color-main in src/index.css). -->
    <meta name="theme-color" content="#14284b" />
    <!-- Files in public/. Vite adds the /bayariq-website/ prefix when it builds. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph: the preview card shown when the link is shared on WhatsApp, X, Facebook and others.
         Crawlers need full URLs here. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="أسواق بيارق الخير الاقتصادية" />
    <meta
      property="og:title"
      content="أسواق بيارق الخير الاقتصادية | فروعنا في جدة"
    />
    <meta
      property="og:description"
      content="أربعة فروع في جدة: الحمدانية وكيلو 14 والمحاميد، وبيارق التوفيق في الحرازات. تصفّح منتجاتنا وعروضنا، وأرسل طلبك عبر واتساب."
    />
    <meta
      property="og:url"
      content="https://ahmedalsoufi14-4r4s.github.io/bayariq-website/"
    />
    <meta
      property="og:image"
      content="https://ahmedalsoufi14-4r4s.github.io/bayariq-website/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="أسواق بيارق الخير الاقتصادية، فروعنا في جدة"
    />
    <meta property="og:locale" content="ar_SA" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Starts downloading the two font files the first screen needs (regular and bold Arabic)
         right away, so the text rarely has to switch fonts after it shows. See src/index.css. -->
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-arabic-400-arabic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-arabic-700-arabic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Picks light or dark before the page shows, so it never flashes the wrong colors.
      // The visitor's saved choice wins, otherwise we follow their device setting.
      // Same storage key as in src/components/ThemeToggle.jsx.
      let savedTheme = null
      try {
        savedTheme = localStorage.getItem('bayariq-theme')
      } catch {
        // Storage is blocked: follow the device setting.
      }
      const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches
      if (savedTheme === 'dark' || (savedTheme !== 'light' && prefersDark)) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body class="bg-base text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
